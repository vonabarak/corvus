[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "corvus-image-builder"
version = "0.1.0"
requires-python = ">=3.10"
description = "Composable image build stages for Corvus builder VMs"

[project.scripts]
corvus-image-builder = "corvus_image_builder.cli:main"
