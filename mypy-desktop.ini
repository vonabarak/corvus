[mypy]
python_version = 3.10
mypy_path = python
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
no_implicit_optional = true
strict = true
exclude = (?x)(^|/)\.venv|(^|/)_generated/
# ``Any`` is an escape hatch, not a substitute for an interface.
disallow_any_explicit = true

[mypy-capnp]
ignore_missing_imports = true

[mypy-numpy]
# pytest imports NumPy only for optional approx() annotations. Host NumPy
# stubs can use Python 3.12 syntax while Corvus still targets Python 3.10.
follow_imports = skip
follow_imports_for_stubs = true

# pyte has no published typing metadata. Its dynamic terminal model is
# contained inside serial_console.py; first-party values crossing that edge
# are explicitly typed.
[mypy-pyte]
ignore_missing_imports = true
