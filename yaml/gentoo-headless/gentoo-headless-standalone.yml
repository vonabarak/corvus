# Gentoo headless with Cloud-init, using official mirrors and no host mounts.
# Publishes gentoo-headless-cloudinit:standalone (also moves latest).
# `make build-headless-standalone` prepares the shared gentoo-cloud import first.

vars:
  image_if_exists: update

pipeline:
  - apply:
      ifExists: overwrite
      templates:
        - name: gentoo-cloud-standalone
          cpuCount: 4
          ram: 2G
          cloudInit: true
          guestAgent: true
          description: "Gentoo bake template (no host mounts; official mirrors only)"
          cloudInitConfig:
            userData:
              runcmd:
                - emerge-webrsync --quiet
                - getuto
                - emerge --getbinpkg --usepkg --binpkg-respect-use=y --quiet-build app-emulation/qemu-guest-agent
                - systemctl enable --now qemu-guest-agent.service
          drives:
            - diskImage: gentoo-cloud:latest
              interface: virtio
              strategy: overlay
              cacheType: writeback
              discard: true
            - diskImage: ovmf-code
              interface: pflash
              readOnly: true
              strategy: direct
            - diskImage: ovmf-vars
              interface: pflash
              strategy: clone
          networkInterfaces:
            - network: corvus
          sshKeys:
            - name: corvus

  - build:
      name: gentoo-headless-cloudinit:standalone
      description: Minimal headless Gentoo with custom kernel (BIOS+GPT, ext4); self-contained — no host mounts
      template: gentoo-cloud-standalone

      target:
        ifExists: "{{ image_if_exists }}"
        format: qcow2
        size: 20G
        path: BaseImages/Gentoo/
        compact: true

      strategy: from-scratch

      vm:
        cpuCount: 4
        ram: 4G

      shellDefaults:
        preamble: "set -eux"
        env:
          SYSROOT: /mnt/sysroot
          DEV: /dev/vdb

      provisioners:
        - shell:
            script: ./scripts/wait-for-network.sh
            timeoutSec: 130
        - shell:
            env:
              BUILD_SOURCE: standalone
            script: ./scripts/prepare-bake-host.sh
            timeoutSec: 7200

        - file:
            from: ./gentoo-kernel
            to: /tmp/gentoo-kernel-config
            mode: "0644"

        - shell:
            script: ./scripts/partition-disk.sh
            timeoutSec: 120

        - shell:
            script: ./scripts/bootstrap-system.sh
            timeoutSec: 7200

        - shell:
            script: ./scripts/build-kernel.sh
            timeoutSec: 14400

        - shell:
            script: ./scripts/install-runtime.sh
            timeoutSec: 1800

        - shell:
            script: ./scripts/install-grub.sh
            timeoutSec: 600

        - shell:
            script: ./scripts/configure-system.sh
            timeoutSec: 120

        - shell:
            script: ./scripts/install-cloud-init.sh
            env:
              IMAGE_ROOT: /mnt/sysroot
            timeoutSec: 1800

        - shell:
            script: ./scripts/finalize-image.sh
            env:
              IMAGE_ROOT: /mnt/sysroot
            timeoutSec: 300

      cleanup: onSuccess
