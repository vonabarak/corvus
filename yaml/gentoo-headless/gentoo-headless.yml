# Regular Gentoo headless pipeline: cached builder, headless, then Cloud-init.
# `make build-headless` prepares the shared gentoo-cloud import first.
# Common provisioning lives in scripts/; early QGA bootstrap stays below.

vars:
  image_if_exists: update
  nfs_binpkgs: "192.168.72.1:/data/portage/binpkgs_corvus"

pipeline:
  - apply:
      ifExists: overwrite
      templates:
        - name: gentoo-cloud
          cpuCount: 8
          ram: 8G
          cloudInit: true
          guestAgent: true
          startupTimeoutSec: 1200
          description: "Gentoo cloud-init bake host (stage 1)"
          cloudInitConfig:
            userData:
              bootcmd:
                - [ mkdir, -p, /var/db/repos ]
                - [ sh, -c, "mountpoint -q /var/db/repos || mount -t virtiofs repos /var/db/repos" ]
                - [ mkdir, -p, /var/cache/distfiles, /run/distfiles-host, /var/tmp/distfiles-upper, /var/tmp/distfiles-work ]
                - [ sh, -c, "mountpoint -q /run/distfiles-host || mount -t virtiofs distfiles /run/distfiles-host" ]
                - [ sh, -c, "mountpoint -q /var/cache/distfiles || mount -t overlay overlay -o lowerdir=/run/distfiles-host,upperdir=/var/tmp/distfiles-upper,workdir=/var/tmp/distfiles-work /var/cache/distfiles" ]
              runcmd:
                - emerge --getbinpkg --usepkg --binpkg-respect-use=y --quiet-build net-fs/nfs-utils
                - mkdir -p /var/cache/binpkgs
                - mount -t nfs4 -o rw,vers=4.2 '{{ nfs_binpkgs }}' /var/cache/binpkgs
                - sh -c "echo '{{ nfs_binpkgs }} /var/cache/binpkgs nfs4 rw,_netdev,vers=4.2 0 0' >> /etc/fstab"
                - sh -c 'printf "\nFEATURES=\"\${FEATURES} -binpkg-request-signature binpkg-ignore-signature\"\nGPG_VERIFY_USER_DROP=\"\"\nGPG_VERIFY_GROUP_DROP=\"\"\n" >> /etc/portage/make.conf'
                - emerge --getbinpkg --usepkg --binpkg-respect-use=y --quiet-build app-emulation/qemu-guest-agent
                - systemctl enable --now qemu-guest-agent.service
          sharedDirs:
            - path: /var/db/repos
              tag: repos
              readOnly: true
            - path: /data/portage/distfiles
              tag: distfiles
              readOnly: true
          drives:
            - diskImage: gentoo-cloud:latest
              interface: virtio
              strategy: overlay
              cacheType: writeback
              discard: true
            - diskImage: ovmf-code
              interface: pflash
              readOnly: true
              strategy: direct
            - diskImage: ovmf-vars
              interface: pflash
              strategy: clone
          networkInterfaces:
            - network: corvus
          sshKeys:
            - name: corvus

  - build:
      name: gentoo-builder
      description: Gentoo bake host with builder tools pre-installed
      template: gentoo-cloud

      target:
        ifExists: "{{ image_if_exists }}"
        format: qcow2
        size: 12G
        path: BaseImages/Gentoo/
        compact: true
        ephemeral: true

      strategy: overlay

      vm:
        cpuCount: 8
        ram: 8G

      shellDefaults:
        preamble: "set -eux"

      provisioners:
        - shell:
            script: ./scripts/wait-for-network.sh
            timeoutSec: 130
        - shell:
            script: ./scripts/prepare-bake-host.sh
            env:
              BUILD_SOURCE: mounted
            timeoutSec: 7200
        - shell:
            script: ./scripts/finalize-image.sh
            env:
              IMAGE_ROOT: /
            timeoutSec: 300

      cleanup: onSuccess

  - apply:
      ifExists: overwrite
      templates:
        - name: gentoo-builder-bake
          cpuCount: 8
          ram: 8G
          cloudInit: true
          guestAgent: true
          startupTimeoutSec: 1200
          description: "Gentoo builder bake VM (stage 2's bake host)"
          cloudInitConfig:
            userData:
              bootcmd:
                - [ mkdir, -p, /var/db/repos ]
                - [ sh, -c, "mountpoint -q /var/db/repos || mount -t virtiofs repos /var/db/repos" ]
                - [ mkdir, -p, /var/cache/distfiles, /run/distfiles-host, /var/tmp/distfiles-upper, /var/tmp/distfiles-work ]
                - [ sh, -c, "mountpoint -q /run/distfiles-host || mount -t virtiofs distfiles /run/distfiles-host" ]
                - [ sh, -c, "mountpoint -q /var/cache/distfiles || mount -t overlay overlay -o lowerdir=/run/distfiles-host,upperdir=/var/tmp/distfiles-upper,workdir=/var/tmp/distfiles-work /var/cache/distfiles" ]
              runcmd:
                - mkdir -p /var/cache/binpkgs
                - mount -t nfs4 -o rw,vers=4.2 '{{ nfs_binpkgs }}' /var/cache/binpkgs
                - sh -c "echo '{{ nfs_binpkgs }} /var/cache/binpkgs nfs4 rw,_netdev,vers=4.2 0 0' >> /etc/fstab"
          sharedDirs:
            - path: /var/db/repos
              tag: repos
              readOnly: true
            - path: /data/portage/distfiles
              tag: distfiles
              readOnly: true
          drives:
            - diskImage: gentoo-builder
              interface: virtio
              strategy: overlay
              cacheType: writeback
              discard: true
            - diskImage: ovmf-code
              interface: pflash
              readOnly: true
              strategy: direct
            - diskImage: ovmf-vars
              interface: pflash
              strategy: clone
          networkInterfaces:
            - network: corvus
          sshKeys:
            - name: corvus

  - build:
      name: gentoo-headless
      description: Minimal headless Gentoo with custom kernel (BIOS+GPT, ext4) — no cloud-init
      template: gentoo-builder-bake

      target:
        ifExists: "{{ image_if_exists }}"
        format: qcow2
        size: 20G
        path: BaseImages/Gentoo/
        compact: true

      strategy: from-scratch

      vm:
        cpuCount: 8
        ram: 8G

      shellDefaults:
        preamble: "set -eux"
        env:
          SYSROOT: /mnt/sysroot
          DEV: /dev/vdb

      provisioners:
        - shell:
            script: ./scripts/wait-for-network.sh
            timeoutSec: 130
        - file:
            from: ./gentoo-kernel
            to: /tmp/gentoo-kernel-config
            mode: "0644"
        - shell:
            script: ./scripts/partition-disk.sh
            timeoutSec: 120
        - shell:
            script: ./scripts/bootstrap-system.sh
            timeoutSec: 7200

        - shell:
            script: ./scripts/build-kernel.sh
            timeoutSec: 14400

        - shell:
            script: ./scripts/install-runtime.sh
            timeoutSec: 1800

        - shell:
            script: ./scripts/install-grub.sh
            timeoutSec: 600

        - shell:
            script: ./scripts/configure-system.sh
            timeoutSec: 120

        - shell:
            script: ./scripts/finalize-image.sh
            env:
              IMAGE_ROOT: /mnt/sysroot
            timeoutSec: 300

      cleanup: onSuccess

  - apply:
      ifExists: overwrite
      templates:
        - name: gentoo-headless-bake
          cpuCount: 8
          ram: 8G
          cloudInit: false
          guestAgent: true
          startupTimeoutSec: 1200
          headless: true
          description: "Gentoo headless bake VM (stage 3's bake host)"
          sharedDirs:
            - path: /var/db/repos
              tag: repos
              readOnly: true
            - path: /data/portage/distfiles
              tag: distfiles
              readOnly: true
          drives:
            - diskImage: gentoo-headless
              interface: virtio
              strategy: overlay
              cacheType: writeback
              discard: true
          networkInterfaces:
            - network: corvus

  - build:
      name: gentoo-headless-cloudinit
      description: gentoo-headless + cloud-init (NoCloud datasource)
      template: gentoo-headless-bake

      target:
        ifExists: "{{ image_if_exists }}"
        format: qcow2
        path: BaseImages/Gentoo/
        compact: true

      strategy: overlay

      vm:
        cpuCount: 8
        ram: 8G

      shellDefaults:
        preamble: "set -eux"

      provisioners:
        - shell:
            script: ./scripts/wait-for-network.sh
            timeoutSec: 130
        - shell:
            script: ./scripts/mount-build-caches.sh
            env:
              NFS_BINPKGS: "{{ nfs_binpkgs }}"
            timeoutSec: 180

        - shell:
            script: ./scripts/install-cloud-init.sh
            env:
              IMAGE_ROOT: /
            timeoutSec: 1800
        - shell:
            script: ./scripts/finalize-image.sh
            env:
              IMAGE_ROOT: /
            timeoutSec: 300

      cleanup: onSuccess

  - apply:
      ifExists: overwrite
      templates:
        - name: gentoo-headless
          cpuCount: 8
          ram: 16G
          cloudInit: false
          guestAgent: true
          headless: true
          description: "Gentoo headless (no cloud-init)"
          drives:
            - diskImage: gentoo-headless
              interface: virtio
              strategy: overlay
              cacheType: writeback
              discard: true
              size: 40G
          networkInterfaces:
            - network: corvus

        - name: gentoo-headless-cloudinit
          cpuCount: 8
          ram: 16G
          cloudInit: true
          guestAgent: true
          headless: true
          description: "Gentoo headless (with cloud-init)"
          drives:
            - diskImage: gentoo-headless-cloudinit
              interface: virtio
              strategy: overlay
              cacheType: writeback
              discard: true
              size: 40G
          networkInterfaces:
            - network: corvus
          sshKeys:
            - name: corvus
          cloudInitConfig:
            userData:
              runcmd:
                - [ passwd, -d, root ]
