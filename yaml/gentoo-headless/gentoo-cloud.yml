# yaml-language-server: $schema=../../schema/json/build.schema.json
# `make build-cloud` checks the latest upstream checksum before importing.
vars:
  image_if_exists: update
  gentoo_cloud_url: ~
  gentoo_cloud_tag: ~
  gentoo_cloud_sha256: ~

pipeline:
  - apply:
      ifExists: skip
      disks:
        - name: gentoo-cloud:{{ gentoo_cloud_tag }}
          ifExists: "{{ image_if_exists }}"
          import: "{{ gentoo_cloud_url }}"
          format: qcow2
          path: BaseImages/Gentoo/
          checksum:
            algorithm: sha256
            value: "{{ gentoo_cloud_sha256 }}"
