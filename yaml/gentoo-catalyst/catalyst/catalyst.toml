# Native Catalyst 4.2 configuration; @WORK@ is a private directory in the bake VM.
storedir = "@WORK@"
distdir = "/mnt/corvus-cache/distfiles"
envscript = "/usr/local/lib/corvus-build/catalyst/env.sh"
options = ["bindist", "pkgcache", "kerncache"]
compression_mode = "xz"
digests = ["sha256"]
jobs = 4
load-average = 8.0
binhost = "https://distfiles.gentoo.org/releases/"
