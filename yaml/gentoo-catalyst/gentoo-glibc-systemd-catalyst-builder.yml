# yaml-language-server: $schema=../../schema/json/build.schema.json
vars:
  portage_keyserver: hkps://keys.gentoo.org
  image_if_exists: update
  cache_dir: /data/corvus-cache
pipeline:
- apply:
    templates:
    - name: gentoo-glibc-systemd-catalyst-builder-bootstrap
      hidden: true
      cpuCount: 8
      ram: 16G
      cloudInit: true
      guestAgent: true
      startupTimeoutSec: 1200
      description: Bootstrap Catalyst directly from the upstream Gentoo cloud image
      cloudInitConfig:
        userData:
          runcmd:
          - |
            set -eu
            # Only the first QGA bootstrap may bypass signatures; builder.sh restores verification.
            for attempt in $(seq 1 60); do
                getent hosts distfiles.gentoo.org >/dev/null && break
                sleep 2
            done
            getent hosts distfiles.gentoo.org >/dev/null
            LC_ALL=C localedef -i C -f UTF-8 C.UTF-8
            export FEATURES="-userfetch -userpriv binpkg-multi-instance parallel-fetch -binpkg-request-signature binpkg-ignore-signature -getbinpkg"
            mkdir -p /etc/portage/binrepos.conf
            cat > /etc/portage/binrepos.conf/zz-corvus-cache.conf <<'EOF'
            [binhost]
            location = /var/cache/binhost/x86-64
            priority = 9999
            sync-uri = https://distfiles.gentoo.org/releases/amd64/binpackages/23.0/x86-64
            verify-signature = false
            EOF
            emerge-webrsync --no-pgp-verify -k
            emerge --ignore-default-opts --getbinpkg --usepkg --binpkg-respect-use=y --quiet-build app-emulation/qemu-guest-agent
            systemctl enable --now qemu-guest-agent.service
      sharedDirs:
      - path: '{{ cache_dir }}'
        tag: corvus-cache
      drives:
      - diskImage: gentoo-glibc-systemd-upstream-cloudinit:latest
        interface: virtio
        strategy: overlay
        cacheType: writeback
        discard: true
        size: 80G
      - diskImage: ovmf-code
        interface: pflash
        readOnly: true
        strategy: direct
      - diskImage: ovmf-vars
        interface: pflash
        strategy: clone
      networkInterfaces:
      - network: corvus
      sshKeys:
      - name: corvus
      headless: true
- build:
    name: gentoo-glibc-systemd-catalyst-builder
    description: Standalone Catalyst builder
    template: gentoo-glibc-systemd-catalyst-builder-bootstrap
    strategy: overlay
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      size: 80G
      path: BaseImages/Gentoo/
      compact: true
    shellDefaults:
      preamble: set -eux
      env:
        PORTAGE_KEYSERVER: '{{ portage_keyserver }}'
        FEATURES: -userfetch -userpriv
    provisioners:
    - file:
        from: ./scripts/builder.sh
        to: /usr/local/lib/corvus-build/scripts/builder.sh
        mode: '0755'
    - file:
        from: ../gentoo/scripts/lib/environment.sh
        to: /usr/local/lib/corvus-build/lib/environment.sh
        mode: '0644'
    - file:
        from: ../gentoo/scripts/lib/image.sh
        to: /usr/local/lib/corvus-build/lib/image.sh
        mode: '0644'
    - file:
        from: ../gentoo/scripts/lib/mounts.sh
        to: /usr/local/lib/corvus-build/lib/mounts.sh
        mode: '0644'
    - file:
        from: ../gentoo/scripts/lib/portage.sh
        to: /usr/local/lib/corvus-build/lib/portage.sh
        mode: '0644'
    - shell:
        inline: /bin/bash /usr/local/lib/corvus-build/scripts/builder.sh
        timeoutSec: 28800
    cleanup: onSuccess
- apply:
    templates:
    - name: gentoo-glibc-systemd-catalyst-builder-bake
      hidden: true
      cpuCount: 8
      ram: 16G
      cloudInit: true
      guestAgent: true
      startupTimeoutSec: 1200
      description: Dedicated Catalyst build host
      cloudInitConfig:
        userData:
          runcmd:
          - [systemctl, start, qemu-guest-agent.service]
      sharedDirs:
      - path: '{{ cache_dir }}'
        tag: corvus-cache
      drives:
      - diskImage: gentoo-glibc-systemd-catalyst-builder
        interface: virtio
        strategy: overlay
        cacheType: writeback
        discard: true
        size: 80G
      - diskImage: ovmf-code
        interface: pflash
        readOnly: true
        strategy: direct
      - diskImage: ovmf-vars
        interface: pflash
        strategy: clone
      networkInterfaces:
      - network: corvus
      sshKeys:
      - name: corvus
      headless: true
