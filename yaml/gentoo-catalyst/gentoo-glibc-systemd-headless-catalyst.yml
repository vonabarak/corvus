# yaml-language-server: $schema=../../schema/json/build.schema.json
vars:
  portage_keyserver: hkps://keys.gentoo.org
  image_if_exists: update
  cache_dir: /data/corvus-cache
  stage3_url: null
  stage3_sha256: null
  repo_commit: null
pipeline:
- build:
    name: gentoo-glibc-systemd-headless-catalyst
    description: Standalone Catalyst stage4 headless image, custom kernel, BIOS and UEFI
    template: gentoo-glibc-systemd-catalyst-builder-bake
    strategy: from-scratch
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      size: 20G
      path: BaseImages/Gentoo/
      compact: true
    shellDefaults:
      preamble: set -eux
      env:
        PORTAGE_KEYSERVER: '{{ portage_keyserver }}'
        FEATURES: -userfetch -userpriv
        STAGE3_URL: '{{ stage3_url }}'
        STAGE3_SHA256: '{{ stage3_sha256 }}'
        REPO_COMMIT: '{{ repo_commit }}'
        IMAGE_LIBC: glibc
        IMAGE_INIT: systemd
        IMAGE_ROOT: /mnt/sysroot
        TARGET_DISK: /dev/vdb
    provisioners:
    - file:
        from: ./scripts/build.sh
        to: /usr/local/lib/corvus-build/scripts/build.sh
        mode: '0755'
    - file:
        from: ../gentoo/scripts/lib/environment.sh
        to: /usr/local/lib/corvus-build/lib/environment.sh
        mode: '0644'
    - file:
        from: ../gentoo/scripts/lib/disk.sh
        to: /usr/local/lib/corvus-build/lib/disk.sh
        mode: '0644'
    - file:
        from: ../gentoo/scripts/lib/image.sh
        to: /usr/local/lib/corvus-build/lib/image.sh
        mode: '0644'
    - file:
        from: ../gentoo/scripts/lib/mounts.sh
        to: /usr/local/lib/corvus-build/lib/mounts.sh
        mode: '0644'
    - file:
        from: ../gentoo/scripts/lib/portage.sh
        to: /usr/local/lib/corvus-build/lib/portage.sh
        mode: '0644'
    - file:
        from: ./catalyst/catalyst.toml
        to: /usr/local/lib/corvus-build/catalyst/catalyst.toml
        mode: '0644'
    - file:
        from: ./catalyst/env.sh
        to: /usr/local/lib/corvus-build/catalyst/env.sh
        mode: '0644'
    - file:
        from: ./catalyst/finish.sh
        to: /usr/local/lib/corvus-build/catalyst/finish.sh
        mode: '0755'
    - file:
        from: ./catalyst/lib.sh
        to: /usr/local/lib/corvus-build/catalyst/lib.sh
        mode: '0644'
    - file:
        from: ./catalyst/portage/profile/make.defaults
        to: /usr/local/lib/corvus-build/catalyst/portage/profile/make.defaults
        mode: '0644'
    - file:
        from: ./catalyst/root-overlay/etc/hostname
        to: /usr/local/lib/corvus-build/catalyst/root-overlay/etc/hostname
        mode: '0644'
    - file:
        from: ./catalyst/root-overlay/etc/hosts
        to: /usr/local/lib/corvus-build/catalyst/root-overlay/etc/hosts
        mode: '0644'
    - file:
        from: ./catalyst/root-overlay/etc/locale.conf
        to: /usr/local/lib/corvus-build/catalyst/root-overlay/etc/locale.conf
        mode: '0644'
    - file:
        from: ./catalyst/root-overlay/etc/locale.gen
        to: /usr/local/lib/corvus-build/catalyst/root-overlay/etc/locale.gen
        mode: '0644'
    - file:
        from: ./catalyst/root-overlay/etc/systemd/network/20-wired.network
        to: /usr/local/lib/corvus-build/catalyst/root-overlay/etc/systemd/network/20-wired.network
        mode: '0644'
    - file:
        from: ./catalyst/root-overlay/etc/systemd/system/sshd-hostkeys.service
        to: /usr/local/lib/corvus-build/catalyst/root-overlay/etc/systemd/system/sshd-hostkeys.service
        mode: '0644'
    - file:
        from: ./catalyst/root-overlay/etc/systemd/system/sshd-unix-local.socket.d/hostkeys.conf
        to: /usr/local/lib/corvus-build/catalyst/root-overlay/etc/systemd/system/sshd-unix-local.socket.d/hostkeys.conf
        mode: '0644'
    - file:
        from: ./catalyst/root-overlay/etc/systemd/system/sshd-vsock.socket.d/hostkeys.conf
        to: /usr/local/lib/corvus-build/catalyst/root-overlay/etc/systemd/system/sshd-vsock.socket.d/hostkeys.conf
        mode: '0644'
    - file:
        from: ./catalyst/root-overlay/etc/systemd/system/sshd.service.d/hostkeys.conf
        to: /usr/local/lib/corvus-build/catalyst/root-overlay/etc/systemd/system/sshd.service.d/hostkeys.conf
        mode: '0644'
    - file:
        from: ./catalyst/stage4.spec
        to: /usr/local/lib/corvus-build/catalyst/stage4.spec
        mode: '0644'
    - file:
        from: ../gentoo/scripts/stages/kernel/gentoo-kernel
        to: /usr/local/lib/corvus-build/catalyst/kernel.config
        mode: '0644'
    - shell:
        inline: /bin/bash /usr/local/lib/corvus-build/scripts/build.sh
        timeoutSec: 28800
    cleanup: onSuccess
- apply:
    templates:
    - name: gentoo-glibc-systemd-headless-catalyst
      cpuCount: 8
      ram: 16G
      cloudInit: false
      guestAgent: true
      headless: true
      description: Gentoo headless (no cloud-init) (Catalyst)
      drives:
      - diskImage: gentoo-glibc-systemd-headless-catalyst
        interface: virtio
        strategy: overlay
        cacheType: writeback
        discard: true
        size: 20G
      networkInterfaces:
      - network: corvus
    - name: gentoo-glibc-systemd-headless-catalyst-uefi
      cpuCount: 8
      ram: 16G
      cloudInit: false
      guestAgent: true
      headless: true
      description: Gentoo headless UEFI (no cloud-init) (Catalyst)
      drives:
      - diskImage: gentoo-glibc-systemd-headless-catalyst
        interface: virtio
        strategy: overlay
        cacheType: writeback
        discard: true
        size: 20G
      - diskImage: ovmf-code
        interface: pflash
        readOnly: true
        strategy: direct
      - diskImage: ovmf-vars
        interface: pflash
        strategy: clone
      networkInterfaces:
      - network: corvus
