---
# Windows 11 Pro image — unattended, VirtIO-enabled build pipeline.
#
# Before running this pipeline, manually download the Windows 11 x64
# multi-edition ISO and register it with Corvus as `windows-11-iso`. The
# pipeline downloads VirtIO-Win 0.1.302 with SHA-256 verification if `virtio-win-iso` is absent.
# Then run:
#
#   make image IMAGE=windows-11
#
# The pipeline uploads a locally prepared answer ISO, downloads missing VirtIO
# media, registers OVMF firmware, and creates a temporary installer template
# with the three ISO disks. It then publishes a generalized, decrypted base
# image, deletes the successful bake
# VM, and registers the `windows-11-pro` overlay template.
#
# The image contains the VirtIO drivers, QEMU Guest Agent, SPICE guest tools,
# WinFSP, and the VirtIO-FS guest service. Cloudbase-Init/cloud-init is not
# installed or enabled.
#
# Installation runs without TPM. Every runtime VM gets its own TPM state on
# first start. Automatic device encryption is disabled; BitLocker is opt-in
# after instantiation. See README.md for first boot and rebuilding old images.
#
# Requirements:
#   * The `windows-11-iso` disk must be a registered Windows 11 x64
#     multi-edition installation ISO.
#   * The node must have internet access to download missing VirtIO-Win media.
#   * The `corvus` managed network must exist and provide outbound internet;
#     audit-mode provisioning downloads a pinned, checksummed WinFSP MSI.
#   * The host must provide the OVMF files registered below.
#
# Expect roughly 45-70 minutes on KVM. The bake is graphical so failures can be
# inspected over SPICE. Provisioning logs are under C:\Windows\Temp\; failures
# deliberately leave the VM running until the installer build times out.

_ovmf_code_drive: &ovmf_code
  diskImage: ovmf-code-secboot
  interface: pflash
  readOnly: true
  strategy: direct

_ovmf_vars_drive: &ovmf_vars
  diskImage: ovmf-vars-secboot
  interface: pflash
  strategy: clone

pipeline:
  # The Makefile creates this ISO with Autounattend.xml at its root. Upload
  # steps are client-local and must lead the pipeline; the resulting disk is
  # otherwise ordinary template media.
  - upload:
      name: windows-11-autounattend
      from: ./build/autounattend.iso
      format: raw
      ifExists: overwrite

  - apply:
      ifExists: skip
      disks:
        - name: virtio-win-iso
          import: "https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/archive-virtio/virtio-win-0.1.302-1/virtio-win-0.1.302.iso"
          checksum:
            algorithm: sha256
            value: "303f7ae40dad495d6ae474fdc571df58958a4dbc5c37a522d80f9a203867949d"
          format: raw
          path: ISOs/VirtIO/
        - name: ovmf-code-secboot
          register: "/usr/share/edk2/OvmfX64/OVMF_CODE_4M.secboot.qcow2"
          format: qcow2
        - name: ovmf-vars-secboot
          register: "/usr/share/edk2/OvmfX64/OVMF_VARS_4M.secboot.qcow2"
          format: qcow2

      templates:
        - name: windows-11-installer
          description: "Windows 11 Pro unattended installer (bake-only)"
          cpuCount: 4
          ram: 8G
          headless: false
          cloudInit: false
          graphicsAdapter: qxl-vga
          balloon: true
          audioDevices:
            - model: intel-hda
              backend: spice
          # Never seal the reusable image to the installer's TPM keys.
          tpm: false
          # The installer strategy waits for guest-initiated shutdown and does
          # not wait for QGA, which is installed in audit mode.
          guestAgent: false
          drives:
            # The installer strategy captures the first drive as the artifact.
            # 80 GiB exceeds Windows 11's 64 GiB minimum and leaves room for
            # updates and the guest integration packages.
            - interface: virtio
              media: disk
              strategy: create
              format: qcow2
              size: 80G
              cacheType: writeback
            - *ovmf_code
            - *ovmf_vars
            # Windows media is registered manually; VirtIO media is imported
            # above when absent. Drive ordering is significant: autounattend.xml
            # expects the Windows installer at D: and VirtIO-Win media at E:.
            - diskImage: windows-11-iso
              interface: ide
              media: cdrom
              readOnly: true
              strategy: direct
            - diskImage: virtio-win-iso
              interface: ide
              media: cdrom
              readOnly: true
              strategy: direct
            # Windows Setup searches removable media for a root-level
            # Autounattend.xml. Keep this after the Windows and VirtIO ISOs so
            # their expected D: and E: drive letters stay stable.
            - diskImage: windows-11-autounattend
              interface: ide
              media: cdrom
              readOnly: true
              strategy: direct
          networkInterfaces:
            - network: corvus

  - build:
      name: windows-11-pro-base
      description: "Generalized, decrypted Windows 11 Pro with VirtIO guest integration"
      template: windows-11-installer

      target:
        ifExists: skip
        format: qcow2
        compact: true
        path: BaseImages/Windows11/

      strategy: installer

      vm:
        cpuCount: 4
        ram: 8G

      # Dismiss OVMF's short "Press any key to boot from CD or DVD" prompt.
      bootKeys:
        - keys: ret
          delaySec: 3
          repeat: 6
          intervalSec: 1

      # Allow 90 minutes for Windows installation and guest setup. Successful
      # provisioning ends with Sysprep's guest-initiated shutdown.
      waitForShutdownSec: 5400

      provisioners: []

      # Retain failed bake VMs for inspection; remove successful bake VMs.
      cleanup: onSuccess

  - apply:
      ifExists: skip
      templates:
        - name: windows-11-pro
          description: "Windows 11 Pro overlay VM with an independent TPM; BitLocker opt-in"
          cpuCount: 4
          ram: 8G
          headless: false
          cloudInit: false
          guestAgent: true
          vsock: false
          graphicsAdapter: qxl-vga
          tpm: true
          balloon: true
          audioDevices:
            - model: intel-hda
              backend: spice
          drives:
            - diskImage: windows-11-pro-base
              interface: virtio
              media: disk
              strategy: overlay
              cacheType: writeback
              discard: true
            - *ovmf_code
            - *ovmf_vars
          networkInterfaces:
            - network: corvus
