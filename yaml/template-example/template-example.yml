name: "almalinux-10"
description: "Standard web server template with 20GB root disk"
cpuCount: 2
ram: 2G
guestAgent: true
drives:
  - diskImage: "Almalinux-10"
    interface: "virtio"
    strategy: "overlay"  # options: clone, overlay, direct
    size: 20G        # resize disk after instantiation
networkInterfaces:
  - type: "vde"         # options: user, bridge, tap, vde
sshKeys:
  - name: "corvus"