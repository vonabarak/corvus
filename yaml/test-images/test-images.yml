---
# An apply setup using images built by `make image IMAGE=corvus-test-vm` and
# `make image IMAGE=windows`.

# Keep writable guest disks even when their source images are rebuilt.
disks:
  - name: windows-server-2025
    ifExists: skip
    overlay: windows-server-2025-eval
    path: BaseImages/WindowsServer2025/

  - name: gentoo-test-vm
    ifExists: skip
    overlay: corvus-test-vm
    path: BaseImages/Gentoo/

  - name: gentoo-test-vm-ovmf-vars
    ifExists: skip
    clone: ovmf-vars
    path: BaseImages/Gentoo/

  - name: windows-server-2025-ovmf-vars
    ifExists: skip
    clone: ovmf-vars
    path: BaseImages/WindowsServer2025/

vms:
  - name: gentoo-test-vm
    cpuCount: 4
    ram: 4G
    description: "Gentoo musl/OpenRC test VM"
    cloudInit: false
    guestAgent: true
    drives:
      - disk: gentoo-test-vm
        interface: virtio
        media: disk
        cacheType: writeback
        discard: true
      - disk: ovmf-code
        interface: pflash
        readOnly: true
      - disk: gentoo-test-vm-ovmf-vars
        interface: pflash
    networkInterfaces:
      - network: corvus

  - name: windows-server-2025
    cpuCount: 4
    ram: 4G
    description: "Windows Server 2025"
    cloudInit: true
    guestAgent: true
    cloudInitConfig:
      injectSshKeys: false
      userData: |
        #ps1_sysnative
        # Set Administrator password
        net user Administrator "corvus" /y
        # Install Remote Desktop Session Host feature
        Install-WindowsFeature -Name RDS-RD-Server
        # Enable RDP connections
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name UserAuthentication -Value 0
        # Enable RDP firewall rules
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        # Start Remote Desktop service
        Set-Service -Name TermService -StartupType Automatic
        Start-Service TermService
    drives:
      - disk: ovmf-code
        interface: pflash
        readOnly: true
      - disk: windows-server-2025-ovmf-vars
        interface: pflash
      - disk: windows-server-2025
        interface: virtio
        media: disk
        cacheType: writeback
        discard: true
    networkInterfaces:
      - network: corvus
