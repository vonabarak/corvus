# yaml-language-server: $schema=../../../schema/json/build.schema.json
vars:
  portage_keyserver: hkps://keys.gentoo.org
  image_if_exists: update
  cache_dir: /data/corvus-cache
  USEPKG: 'true'
  GETBINPKG: 'true'
pipeline:
- apply:
    templates:
    - name: gentoo-musl-openrc-builder-bake
      hidden: true
      cpuCount: 8
      ram: 16G
      cloudInit: false
      guestAgent: true
      startupTimeoutSec: 1200
      description: Native musl/OpenRC Python build host
      sharedDirs:
      - path: '{{ cache_dir }}'
        tag: corvus-cache
      drives:
      - diskImage: gentoo-musl-openrc-builder:latest
        interface: virtio
        strategy: overlay
        cacheType: writeback
        discard: true
        size: 40G
      - diskImage: ovmf-code
        interface: pflash
        readOnly: true
        strategy: direct
      - diskImage: ovmf-vars
        interface: pflash
        strategy: clone
      networkInterfaces:
      - network: corvus
      headless: true
- build:
    name: gentoo-musl-openrc-headless
    description: Gentoo musl/OpenRC BIOS/UEFI
    template: gentoo-musl-openrc-builder-bake
    strategy: from-scratch
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      size: 4G
      path: BaseImages/Gentoo/
      compact: true
    shellDefaults:
      preamble: set -eux
      env:
        USEPKG: '{{ USEPKG }}'
        GETBINPKG: '{{ GETBINPKG }}'
        PORTAGE_KEYSERVER: '{{ portage_keyserver }}'
        IMAGE_LIBC: musl
        IMAGE_INIT: openrc
        IMAGE_ROOT: /mnt/sysroot
        TARGET_DISK: /dev/vdb
        KERNEL_CONFIG: /run/corvus-kernel-config
        FEATURES: -userfetch -userpriv
    provisioners:
    - file:
        from: ./build-base.pyz
        to: /run/musl-openrc-headless.pyz
        mode: '0644'
    - file:
        from: ../common/kernel/gentoo-kernel
        to: /run/corvus-kernel-config
        mode: '0644'
    - shell:
        inline: python3 /run/musl-openrc-headless.pyz
        timeoutSec: 28800
    cleanup: onSuccess
- build:
    name: gentoo-musl-openrc-headless-cloudinit
    description: Gentoo musl/OpenRC system with NoCloud cloud-init
    template: gentoo-musl-openrc-builder-bake
    strategy: offline-overlay
    sourceImage: gentoo-musl-openrc-headless
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      size: 4G
      path: BaseImages/Gentoo/
      compact: true
    shellDefaults:
      preamble: set -eux
      env:
        USEPKG: '{{ USEPKG }}'
        GETBINPKG: '{{ GETBINPKG }}'
        PORTAGE_KEYSERVER: '{{ portage_keyserver }}'
        IMAGE_LIBC: musl
        IMAGE_INIT: openrc
        IMAGE_ROOT: /mnt/sysroot
        TARGET_DISK: /dev/vdb
        FEATURES: -userfetch -userpriv
    provisioners:
    - file:
        from: ./build-cloudinit.pyz
        to: /run/build-cloudinit.pyz
        mode: '0644'
    - shell:
        inline: python3 /run/build-cloudinit.pyz
        timeoutSec: 28800
    cleanup: onSuccess
- apply:
    templates:
    - name: gentoo-musl-openrc-headless
      description: Gentoo musl/OpenRC
      cpuCount: 1
      ram: 512M
      cloudInit: false
      guestAgent: true
      headless: true
      drives:
      - diskImage: gentoo-musl-openrc-headless
        interface: virtio
        strategy: overlay
        discard: true
        cacheType: writeback
      networkInterfaces:
      - network: corvus
    - name: gentoo-musl-openrc-headless-uefi
      description: Gentoo musl/OpenRC
      cpuCount: 1
      ram: 512M
      cloudInit: false
      guestAgent: true
      headless: true
      drives:
      - diskImage: gentoo-musl-openrc-headless
        interface: virtio
        strategy: overlay
        discard: true
        cacheType: writeback
      - diskImage: ovmf-code
        interface: pflash
        readOnly: true
        strategy: direct
      - diskImage: ovmf-vars
        interface: pflash
        strategy: clone
      networkInterfaces:
      - network: corvus
    - name: gentoo-musl-openrc-headless-cloudinit
      description: Gentoo musl/OpenRC with cloud-init
      cpuCount: 1
      ram: 512M
      cloudInit: true
      sshKeys:
      - name: corvus
      guestAgent: true
      headless: true
      drives:
      - diskImage: gentoo-musl-openrc-headless-cloudinit
        interface: virtio
        strategy: overlay
        discard: true
        cacheType: writeback
      networkInterfaces:
      - network: corvus
      cloudInitConfig:
        userData:
          runcmd:
          - - passwd
            - -d
            - root
    - name: gentoo-musl-openrc-headless-cloudinit-uefi
      description: Gentoo musl/OpenRC with cloud-init
      cpuCount: 1
      ram: 512M
      cloudInit: true
      sshKeys:
      - name: corvus
      guestAgent: true
      headless: true
      drives:
      - diskImage: gentoo-musl-openrc-headless-cloudinit
        interface: virtio
        strategy: overlay
        discard: true
        cacheType: writeback
      - diskImage: ovmf-code
        interface: pflash
        readOnly: true
        strategy: direct
      - diskImage: ovmf-vars
        interface: pflash
        strategy: clone
      networkInterfaces:
      - network: corvus
      cloudInitConfig:
        userData:
          runcmd:
          - - passwd
            - -d
            - root
