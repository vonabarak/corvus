# yaml-language-server: $schema=../../schema/json/build.schema.json
# Prepare registered dependencies and the harness key through the Gentoo Makefile.
vars:
  portage_keyserver: hkps://keys.gentoo.org
  image_if_exists: update
  cache_dir: /data/corvus-cache
  USEPKG: "true"
  GETBINPKG: "true"
pipeline:
- build:
    name: corvus-test-node
    description: Corvus integration-test target; runs the freshly built daemon over
      vsock
    template: gentoo-glibc-systemd-builder-cloudinit-bake
    strategy: offline-overlay
    sourceImage: gentoo-glibc-systemd-headless
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      compact: true
      path: BaseImages/Gentoo/
    shellDefaults:
      preamble: set -eux
      env:
        USEPKG: '{{ USEPKG }}'
        GETBINPKG: '{{ GETBINPKG }}'
        PORTAGE_KEYSERVER: '{{ portage_keyserver }}'
        IMAGE_LIBC: glibc
        IMAGE_INIT: systemd
        IMAGE_ROOT: /mnt/sysroot
        TARGET_DISK: /dev/vdb
        FEATURES: -userfetch -userpriv
    provisioners:
    - file:
        from: ./scripts/images/corvus-test-node/build.sh
        to: /usr/local/lib/corvus-build/images/corvus-test-node/build.sh
        mode: '0755'
    - file:
        from: ./scripts/lib/corvus-build.sh
        to: /usr/local/lib/corvus-build/lib/corvus-build.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/environment.sh
        to: /usr/local/lib/corvus-build/lib/environment.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/image.sh
        to: /usr/local/lib/corvus-build/lib/image.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/mounts.sh
        to: /usr/local/lib/corvus-build/lib/mounts.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/portage.sh
        to: /usr/local/lib/corvus-build/lib/portage.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/postgres.sh
        to: /usr/local/lib/corvus-build/lib/postgres.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/vde-network.sh
        to: /usr/local/lib/corvus-build/lib/vde-network.sh
        mode: '0644'
    - file:
        from: ./scripts/images/corvus-test-node/systemd/corvus-netd.service
        to: /tmp/corvus-test-node/systemd/corvus-netd.service
        mode: '0644'
    - file:
        from: ./scripts/images/corvus-test-node/systemd/corvus-nodeagent.service
        to: /tmp/corvus-test-node/systemd/corvus-nodeagent.service
        mode: '0644'
    - file:
        from: ./scripts/images/corvus-test-node/systemd/corvus-tcp-relay.service
        to: /tmp/corvus-test-node/systemd/corvus-tcp-relay.service
        mode: '0644'
    - file:
        from: ./scripts/images/corvus-test-node/systemd/corvus.service
        to: /tmp/corvus-test-node/systemd/corvus.service
        mode: '0644'
    - file:
        from: ./scripts/images/corvus-test-node/systemd/home-corvus-VMs-BaseImagesRO.mount
        to: /tmp/corvus-test-node/systemd/home-corvus-VMs-BaseImagesRO.mount
        mode: '0644'
    - file:
        from: ./scripts/images/corvus-test-node/systemd/mnt-corvus.mount
        to: /tmp/corvus-test-node/systemd/mnt-corvus.mount
        mode: '0644'
    - file:
        from: ./scripts/images/corvus-test-node/systemd/opt-corvus-bin.mount
        to: /tmp/corvus-test-node/systemd/opt-corvus-bin.mount
        mode: '0644'
    - file:
        from: ../../integration_tests/keys/corvus-test-key.pub
        to: /tmp/corvus-test-node/authorized_keys
        mode: '0600'
    - shell:
        inline: /bin/bash /usr/local/lib/corvus-build/images/corvus-test-node/build.sh
        timeoutSec: 18000
    cleanup: onSuccess
- apply:
    templates:
    - name: corvus-test-node
      # The harness creates its own VMs with per-class shares; this is for inspection.
      description: Corvus integration-test node; instantiate via make dev-node-vm
      cpuCount: 4
      ram: 16G
      guestAgent: true
      headless: true
      drives:
      - diskImage: corvus-test-node
        interface: virtio
        strategy: overlay
        cacheType: writeback
        discard: true
      networkInterfaces:
      - network: corvus
