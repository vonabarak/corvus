# yaml-language-server: $schema=../../schema/json/build.schema.json
# Native runtime and offline cloud-init builds; keep package and sizing policies flavor-specific.
vars:
  image_if_exists: update
  cache_dir: /data/corvus-cache
  USEPKG: "true"
  GETBINPKG: "true"
pipeline:
- build:
    name: gentoo-headless
    description: Minimal headless Gentoo with custom kernel (BIOS+UEFI, GPT, ext4) — no cloud-init
    template: gentoo-builder-bake
    strategy: from-scratch
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      size: 20G
      path: BaseImages/Gentoo/
      compact: true
    vm:
      cpuCount: 8
      ram: 8G
    shellDefaults:
      preamble: set -eux
      env:
        USEPKG: '{{ USEPKG }}'
        GETBINPKG: '{{ GETBINPKG }}'
        IMAGE_LIBC: glibc
        IMAGE_INIT: systemd
        IMAGE_ROOT: /mnt/sysroot
        TARGET_DISK: /dev/vdb
        FEATURES: -userfetch -userpriv
    provisioners:
    - file:
        from: ./scripts/lib/build.sh
        to: /usr/local/lib/corvus-build/build.sh
        mode: '0644'
    - file:
        from: ./scripts/build-kernel.sh
        to: /tmp/build-kernel.sh
        mode: '0755'
    - file:
        from: ./scripts/install-glibc-root.sh
        to: /tmp/install-glibc-root.sh
        mode: '0755'
    - file:
        from: ./scripts/configure-glibc-root.sh
        to: /tmp/configure-glibc-root.sh
        mode: '0755'
    - file:
        from: ./scripts/build-runtime.sh
        to: /tmp/build-runtime.sh
        mode: '0755'
    - file:
        from: ./gentoo-kernel
        to: /tmp/gentoo-kernel-config
        mode: '0644'
    - shell:
        inline: /bin/bash /tmp/build-runtime.sh
        timeoutSec: 28800
    cleanup: onSuccess
- build:
    name: gentoo-headless-cloudinit
    description: gentoo-headless + cloud-init (NoCloud datasource)
    template: gentoo-builder-bake
    strategy: offline-overlay
    sourceImage: gentoo-headless
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      path: BaseImages/Gentoo/
      compact: true
    vm:
      cpuCount: 8
      ram: 8G
    shellDefaults:
      preamble: set -eux
      env:
        USEPKG: '{{ USEPKG }}'
        GETBINPKG: '{{ GETBINPKG }}'
        IMAGE_LIBC: glibc
        IMAGE_INIT: systemd
        IMAGE_ROOT: /mnt/sysroot
        TARGET_DISK: /dev/vdb
        FEATURES: -userfetch -userpriv
    provisioners:
    - file:
        from: ./scripts/lib/build.sh
        to: /usr/local/lib/corvus-build/build.sh
        mode: '0644'
    - file:
        from: ./scripts/install-cloud-init.sh
        to: /tmp/install-cloud-init.sh
        mode: '0755'
    - file:
        from: ./scripts/build-cloud-init.sh
        to: /tmp/build-cloud-init.sh
        mode: '0755'
    - shell:
        inline: /bin/bash /tmp/build-cloud-init.sh
        timeoutSec: 28800
    cleanup: onSuccess
- apply:
    ifExists: overwrite
    templates:
    - name: gentoo-headless
      cpuCount: 8
      ram: 16G
      cloudInit: false
      guestAgent: true
      headless: true
      description: Gentoo headless (no cloud-init)
      drives:
      - diskImage: gentoo-headless
        interface: virtio
        strategy: overlay
        cacheType: writeback
        discard: true
        size: 20G
      networkInterfaces:
      - network: corvus
    - name: gentoo-headless-cloudinit
      cpuCount: 8
      ram: 16G
      cloudInit: true
      guestAgent: true
      headless: true
      description: Gentoo headless (with cloud-init)
      drives:
      - diskImage: gentoo-headless-cloudinit
        interface: virtio
        strategy: overlay
        cacheType: writeback
        discard: true
        size: 40G
      networkInterfaces:
      - network: corvus
      sshKeys:
      - name: corvus
      cloudInitConfig:
        userData:
          runcmd:
          - - passwd
            - -d
            - root
    - name: gentoo-headless-uefi
      cpuCount: 8
      ram: 16G
      cloudInit: false
      guestAgent: true
      headless: true
      description: Gentoo headless UEFI (no cloud-init)
      drives:
      - diskImage: gentoo-headless
        interface: virtio
        strategy: overlay
        cacheType: writeback
        discard: true
        size: 20G
      - diskImage: ovmf-code
        interface: pflash
        readOnly: true
        strategy: direct
      - diskImage: ovmf-vars
        interface: pflash
        strategy: clone
      networkInterfaces:
      - network: corvus
    - name: gentoo-headless-cloudinit-uefi
      cpuCount: 8
      ram: 16G
      cloudInit: true
      guestAgent: true
      headless: true
      description: Gentoo headless UEFI (with cloud-init)
      drives:
      - diskImage: gentoo-headless-cloudinit
        interface: virtio
        strategy: overlay
        cacheType: writeback
        discard: true
        size: 40G
      - diskImage: ovmf-code
        interface: pflash
        readOnly: true
        strategy: direct
      - diskImage: ovmf-vars
        interface: pflash
        strategy: clone
      networkInterfaces:
      - network: corvus
      sshKeys:
      - name: corvus
      cloudInitConfig:
        userData:
          runcmd:
          - - passwd
            - -d
            - root
