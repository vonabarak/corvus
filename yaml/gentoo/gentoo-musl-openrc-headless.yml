# yaml-language-server: $schema=../../schema/json/build.schema.json
# Native runtime and offline cloud-init builds; keep package and sizing policies flavor-specific.
vars:
  portage_keyserver: hkps://keys.gentoo.org
  image_if_exists: update
  cache_dir: /data/corvus-cache
  USEPKG: "true"
  GETBINPKG: "true"
pipeline:
- build:
    name: gentoo-musl-openrc-headless
    description: Gentoo musl/OpenRC system
    template: gentoo-musl-openrc-builder-bake
    strategy: from-scratch
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      size: 4G
      path: BaseImages/Gentoo/
      compact: true
    vm:
      cpuCount: 8
      ram: 8G
    shellDefaults:
      preamble: set -eux
      env:
        USEPKG: '{{ USEPKG }}'
        GETBINPKG: '{{ GETBINPKG }}'
        PORTAGE_KEYSERVER: '{{ portage_keyserver }}'
        IMAGE_LIBC: musl
        IMAGE_INIT: openrc
        IMAGE_ROOT: /mnt/sysroot
        TARGET_DISK: /dev/vdb
        FEATURES: -userfetch -userpriv
    provisioners:
    - file:
        from: ./scripts/images/gentoo-musl-openrc-headless/build.sh
        to: /usr/local/lib/corvus-build/images/gentoo-musl-openrc-headless/build.sh
        mode: '0755'
    - file:
        from: ./scripts/lib/disk.sh
        to: /usr/local/lib/corvus-build/lib/disk.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/environment.sh
        to: /usr/local/lib/corvus-build/lib/environment.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/image.sh
        to: /usr/local/lib/corvus-build/lib/image.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/mounts.sh
        to: /usr/local/lib/corvus-build/lib/mounts.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/portage.sh
        to: /usr/local/lib/corvus-build/lib/portage.sh
        mode: '0644'
    - file:
        from: ./scripts/stages/kernel/build-kernel.sh
        to: /usr/local/lib/corvus-build/stages/kernel/build-kernel.sh
        mode: '0755'
    - file:
        from: ./scripts/stages/musl/configure-root.sh
        to: /usr/local/lib/corvus-build/stages/musl/configure-root.sh
        mode: '0755'
    - file:
        from: ./scripts/stages/musl/install-root.sh
        to: /usr/local/lib/corvus-build/stages/musl/install-root.sh
        mode: '0755'
    - file:
        from: ./scripts/workflows/build-runtime.sh
        to: /usr/local/lib/corvus-build/workflows/build-runtime.sh
        mode: '0755'
    - file:
        from: ./scripts/stages/kernel/gentoo-kernel
        to: /tmp/gentoo-kernel-config
        mode: '0644'
    - shell:
        inline: /bin/bash /usr/local/lib/corvus-build/images/gentoo-musl-openrc-headless/build.sh
        timeoutSec: 28800
    cleanup: onSuccess
- build:
    name: gentoo-musl-openrc-headless-cloudinit
    description: Gentoo musl/OpenRC system with NoCloud cloud-init
    template: gentoo-musl-openrc-builder-bake
    strategy: offline-overlay
    sourceImage: gentoo-musl-openrc-headless
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      size: 4G
      path: BaseImages/Gentoo/
      compact: true
    vm:
      cpuCount: 8
      ram: 8G
    shellDefaults:
      preamble: set -eux
      env:
        USEPKG: '{{ USEPKG }}'
        GETBINPKG: '{{ GETBINPKG }}'
        PORTAGE_KEYSERVER: '{{ portage_keyserver }}'
        IMAGE_LIBC: musl
        IMAGE_INIT: openrc
        IMAGE_ROOT: /mnt/sysroot
        TARGET_DISK: /dev/vdb
        FEATURES: -userfetch -userpriv
    provisioners:
    - file:
        from: ./scripts/images/gentoo-musl-openrc-headless-cloudinit/build.sh
        to: /usr/local/lib/corvus-build/images/gentoo-musl-openrc-headless-cloudinit/build.sh
        mode: '0755'
    - file:
        from: ./scripts/lib/environment.sh
        to: /usr/local/lib/corvus-build/lib/environment.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/image.sh
        to: /usr/local/lib/corvus-build/lib/image.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/mounts.sh
        to: /usr/local/lib/corvus-build/lib/mounts.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/portage.sh
        to: /usr/local/lib/corvus-build/lib/portage.sh
        mode: '0644'
    - file:
        from: ./scripts/stages/install-cloud-init.sh
        to: /usr/local/lib/corvus-build/stages/install-cloud-init.sh
        mode: '0755'
    - file:
        from: ./scripts/workflows/build-cloud-init.sh
        to: /usr/local/lib/corvus-build/workflows/build-cloud-init.sh
        mode: '0755'
    - shell:
        inline: /bin/bash /usr/local/lib/corvus-build/images/gentoo-musl-openrc-headless-cloudinit/build.sh
        timeoutSec: 28800
    cleanup: onSuccess
- apply:
    templates:
    - name: gentoo-musl-openrc-headless
      description: Gentoo musl/OpenRC
      cpuCount: 1
      ram: 512M
      cloudInit: false
      guestAgent: true
      headless: true
      drives:
      - diskImage: gentoo-musl-openrc-headless
        interface: virtio
        strategy: overlay
        discard: true
        cacheType: writeback
      networkInterfaces:
      - network: corvus
    - name: gentoo-musl-openrc-headless-uefi
      description: Gentoo musl/OpenRC
      cpuCount: 1
      ram: 512M
      cloudInit: false
      guestAgent: true
      headless: true
      drives:
      - diskImage: gentoo-musl-openrc-headless
        interface: virtio
        strategy: overlay
        discard: true
        cacheType: writeback
      - diskImage: ovmf-code
        interface: pflash
        readOnly: true
        strategy: direct
      - diskImage: ovmf-vars
        interface: pflash
        strategy: clone
      networkInterfaces:
      - network: corvus
    - name: gentoo-musl-openrc-headless-cloudinit
      description: Gentoo musl/OpenRC with cloud-init
      cpuCount: 1
      ram: 512M
      cloudInit: true
      sshKeys:
      - name: corvus
      guestAgent: true
      headless: true
      drives:
      - diskImage: gentoo-musl-openrc-headless-cloudinit
        interface: virtio
        strategy: overlay
        discard: true
        cacheType: writeback
      networkInterfaces:
      - network: corvus
      cloudInitConfig:
        userData:
          runcmd:
          - - passwd
            - -d
            - root
    - name: gentoo-musl-openrc-headless-cloudinit-uefi
      description: Gentoo musl/OpenRC with cloud-init
      cpuCount: 1
      ram: 512M
      cloudInit: true
      sshKeys:
      - name: corvus
      guestAgent: true
      headless: true
      drives:
      - diskImage: gentoo-musl-openrc-headless-cloudinit
        interface: virtio
        strategy: overlay
        discard: true
        cacheType: writeback
      - diskImage: ovmf-code
        interface: pflash
        readOnly: true
        strategy: direct
      - diskImage: ovmf-vars
        interface: pflash
        strategy: clone
      networkInterfaces:
      - network: corvus
      cloudInitConfig:
        userData:
          runcmd:
          - - passwd
            - -d
            - root
