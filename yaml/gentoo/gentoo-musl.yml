# yaml-language-server: $schema=../../schema/json/build.schema.json
# Native runtime and offline cloud-init builds; keep package and sizing policies flavor-specific.
vars:
  image_if_exists: update
  cache_dir: /data/corvus-cache
pipeline:
- build:
    name: gentoo-musl
    description: Minimal musl/OpenRC runtime
    template: gentoo-musl-builder-bake
    strategy: from-scratch
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      size: 4G
      path: BaseImages/Gentoo/
      compact: true
    vm:
      cpuCount: 8
      ram: 8G
    shellDefaults:
      preamble: set -eux
      env:
        IMAGE_LIBC: musl
        IMAGE_INIT: openrc
        IMAGE_ROOT: /mnt/sysroot
        TARGET_DISK: /dev/vdb
        FEATURES: -userfetch -userpriv
    provisioners:
    - file:
        from: ./scripts/lib/build.sh
        to: /usr/local/lib/corvus-build/build.sh
        mode: '0644'
    - file:
        from: ./scripts/build-kernel.sh
        to: /tmp/build-kernel.sh
        mode: '0755'
    - file:
        from: ./scripts/install-musl-root.sh
        to: /tmp/install-musl-root.sh
        mode: '0755'
    - file:
        from: ./scripts/configure-musl-root.sh
        to: /tmp/configure-musl-root.sh
        mode: '0755'
    - file:
        from: ./scripts/build-runtime.sh
        to: /tmp/build-runtime.sh
        mode: '0755'
    - file:
        from: ./gentoo-kernel
        to: /tmp/gentoo-kernel-config
        mode: '0644'
    - shell:
        inline: /bin/bash /tmp/build-runtime.sh
        timeoutSec: 28800
    cleanup: onSuccess
- build:
    name: gentoo-musl-cloudinit
    description: Minimal musl/OpenRC runtime with NoCloud cloud-init
    template: gentoo-musl-builder-bake
    strategy: offline-overlay
    sourceImage: gentoo-musl
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      size: 4G
      path: BaseImages/Gentoo/
      compact: true
    vm:
      cpuCount: 8
      ram: 8G
    shellDefaults:
      preamble: set -eux
      env:
        IMAGE_LIBC: musl
        IMAGE_INIT: openrc
        IMAGE_ROOT: /mnt/sysroot
        TARGET_DISK: /dev/vdb
        FEATURES: -userfetch -userpriv
    provisioners:
    - file:
        from: ./scripts/lib/build.sh
        to: /usr/local/lib/corvus-build/build.sh
        mode: '0644'
    - file:
        from: ./scripts/install-cloud-init.sh
        to: /tmp/install-cloud-init.sh
        mode: '0755'
    - file:
        from: ./scripts/build-cloud-init.sh
        to: /tmp/build-cloud-init.sh
        mode: '0755'
    - shell:
        inline: /bin/bash /tmp/build-cloud-init.sh
        timeoutSec: 28800
    cleanup: onSuccess
- apply:
    ifExists: overwrite
    templates:
    - name: gentoo-musl
      description: Minimal Gentoo musl/OpenRC
      cpuCount: 1
      ram: 512M
      cloudInit: false
      guestAgent: true
      headless: true
      drives:
      - diskImage: gentoo-musl
        interface: virtio
        strategy: overlay
        discard: true
        cacheType: writeback
      networkInterfaces:
      - network: corvus
    - name: gentoo-musl-uefi
      description: Minimal Gentoo musl/OpenRC
      cpuCount: 1
      ram: 512M
      cloudInit: false
      guestAgent: true
      headless: true
      drives:
      - diskImage: gentoo-musl
        interface: virtio
        strategy: overlay
        discard: true
        cacheType: writeback
      - diskImage: ovmf-code
        interface: pflash
        readOnly: true
        strategy: direct
      - diskImage: ovmf-vars
        interface: pflash
        strategy: clone
      networkInterfaces:
      - network: corvus
    - name: gentoo-musl-cloudinit
      description: Minimal Gentoo musl/OpenRC with cloud-init
      cpuCount: 1
      ram: 512M
      cloudInit: true
      sshKeys:
      - name: corvus
      guestAgent: true
      headless: true
      drives:
      - diskImage: gentoo-musl-cloudinit
        interface: virtio
        strategy: overlay
        discard: true
        cacheType: writeback
      networkInterfaces:
      - network: corvus
      cloudInitConfig:
        userData:
          runcmd:
          - - passwd
            - -d
            - root
    - name: gentoo-musl-cloudinit-uefi
      description: Minimal Gentoo musl/OpenRC with cloud-init
      cpuCount: 1
      ram: 512M
      cloudInit: true
      sshKeys:
      - name: corvus
      guestAgent: true
      headless: true
      drives:
      - diskImage: gentoo-musl-cloudinit
        interface: virtio
        strategy: overlay
        discard: true
        cacheType: writeback
      - diskImage: ovmf-code
        interface: pflash
        readOnly: true
        strategy: direct
      - diskImage: ovmf-vars
        interface: pflash
        strategy: clone
      networkInterfaces:
      - network: corvus
      cloudInitConfig:
        userData:
          runcmd:
          - - passwd
            - -d
            - root
