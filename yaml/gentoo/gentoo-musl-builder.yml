# yaml-language-server: $schema=../../schema/json/build.schema.json
# Bootstrap a reusable musl build host; derivative recipes consume its registered template.
vars:
  image_if_exists: update
  cache_dir: /data/corvus-cache
  musl_stage3_url: ''
  musl_stage3_sha256: ''
pipeline:
- build:
    name: gentoo-musl-builder
    description: Reusable native musl/OpenRC build host
    template: gentoo-builder-bake
    strategy: from-scratch
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      size: 40G
      path: BaseImages/Gentoo/
      compact: true
      ephemeral: true
    vm:
      cpuCount: 8
      ram: 8G
    shellDefaults:
      preamble: set -eux
    provisioners:
    - file:
        from: ./scripts/lib/build.sh
        to: /usr/local/lib/corvus-build/build.sh
        mode: '0644'
    - file:
        from: ./gentoo-kernel
        to: /tmp/gentoo-kernel-config
        mode: '0644'
    - file:
        from: ./scripts/build-kernel.sh
        to: /tmp/build-kernel.sh
        mode: '0755'
    - file:
        from: ./scripts/prepare-musl-builder.sh
        to: /tmp/prepare-musl-builder.sh
        mode: '0755'
    - file:
        from: ./scripts/configure-musl-root.sh
        to: /tmp/configure-musl-root.sh
        mode: '0755'
    - file:
        from: ./scripts/build-musl-builder.sh
        to: /tmp/build-musl-builder.sh
        mode: '0755'
    - shell:
        inline: unshare --mount --propagation private /bin/bash /tmp/build-musl-builder.sh
        env:
          MUSL_STAGE3_URL: '{{ musl_stage3_url }}'
          MUSL_STAGE3_SHA256: '{{ musl_stage3_sha256 }}'
        timeoutSec: 28800
    cleanup: onSuccess
- apply:
    ifExists: overwrite
    templates:
    - name: gentoo-musl-builder-bake
      description: Native musl/OpenRC host with Portage, compiler and disk tools
      cpuCount: 8
      ram: 8G
      cloudInit: false
      guestAgent: true
      headless: true
      startupTimeoutSec: 1200
      sharedDirs:
      - path: '{{ cache_dir }}'
        tag: corvus-cache
      drives:
      - diskImage: gentoo-musl-builder
        interface: virtio
        strategy: overlay
        discard: true
        size: 40G
        cacheType: writeback
      networkInterfaces:
      - network: corvus
