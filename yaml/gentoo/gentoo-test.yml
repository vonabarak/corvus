# yaml-language-server: $schema=../../schema/json/build.schema.json
# Build dependencies through the Gentoo Makefile before running this recipe.
vars:
  image_if_exists: update
  cache_dir: /data/corvus-cache

pipeline:
  - apply:
      ifExists: overwrite
      templates:
        - name: gentoo-test-builder
          cpuCount: 8
          ram: 16G
          cloudInit: true
          guestAgent: true
          headless: true
          description: Gentoo test VM builder
          drives:
            - diskImage: gentoo-headless-cloudinit
              interface: virtio
              strategy: overlay
              cacheType: writeback
              discard: true
              size: 40G
          sharedDirs:
            - path: '{{ cache_dir }}'
              tag: corvus-cache
          networkInterfaces:
            - network: corvus
          sshKeys:
            - name: corvus

  - build:
      name: gentoo-corvus-test
      description: Gentoo image preloaded with everything Corvus builds against
      template: gentoo-test-builder
      strategy: offline-overlay
      sourceImage: gentoo-headless-cloudinit
      target:
        ifExists: '{{ image_if_exists }}'
        compact: true
      shellDefaults:
        preamble: set -eux
      provisioners:
        - file:
            from: ./scripts/provision-test-root.sh
            to: /tmp/provision-test-root.sh
            mode: '0755'
        - file:
            from: ./scripts/build-test-offline.sh
            to: /tmp/build-test-offline.sh
            mode: '0755'
        - shell:
            inline: unshare --mount --propagation private /bin/bash /tmp/build-test-offline.sh
            timeoutSec: 18000
      cleanup: onSuccess

  - apply:
      ifExists: skip
      vms:
        - name: gentoo-corvus-test
          cpuCount: 8
          ram: 16G
          cloudInit: true
          guestAgent: true
          headless: true
          description: Test Gentoo VM for Corvus
          drives:
            - disk: gentoo-corvus-test
              interface: virtio
              cacheType: writeback
              discard: true
          networkInterfaces:
            - network: corvus
          sshKeys:
            - corvus
          cloudInitConfig:
            userData:
              runcmd:
                - [passwd, -d, root]
              users:
                - name: corvus
                  groups: [kvm]
                  sudo: ALL=(ALL) NOPASSWD:ALL
                  shell: /bin/bash
          sharedDirs:
            - path: '{{ cache_dir }}'
              tag: corvus-cache
