# yaml-language-server: $schema=../../schema/json/build.schema.json
# Bootstrap a reusable musl build host; derivative recipes consume its registered template.
vars:
  portage_keyserver: hkps://keys.gentoo.org
  image_if_exists: update
  cache_dir: /data/corvus-cache
  USEPKG: "true"
  GETBINPKG: "true"
  musl_stage3_url: ''
  musl_stage3_sha256: ''
pipeline:
- build:
    name: gentoo-musl-openrc-builder
    description: Reusable native musl/OpenRC build host
    template: gentoo-glibc-systemd-builder-cloudinit-bake
    strategy: from-scratch
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      size: 40G
      path: BaseImages/Gentoo/
      compact: true
    vm:
      cpuCount: 8
      ram: 8G
    shellDefaults:
      preamble: set -eux
      env:
        USEPKG: '{{ USEPKG }}'
        GETBINPKG: '{{ GETBINPKG }}'
        PORTAGE_KEYSERVER: '{{ portage_keyserver }}'
    provisioners:
    - file:
        from: ./scripts/images/gentoo-musl-openrc-builder/build.sh
        to: /usr/local/lib/corvus-build/images/gentoo-musl-openrc-builder/build.sh
        mode: '0755'
    - file:
        from: ./scripts/images/gentoo-musl-openrc-builder/prepare-root.sh
        to: /usr/local/lib/corvus-build/images/gentoo-musl-openrc-builder/prepare-root.sh
        mode: '0755'
    - file:
        from: ./scripts/lib/disk.sh
        to: /usr/local/lib/corvus-build/lib/disk.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/environment.sh
        to: /usr/local/lib/corvus-build/lib/environment.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/image.sh
        to: /usr/local/lib/corvus-build/lib/image.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/mounts.sh
        to: /usr/local/lib/corvus-build/lib/mounts.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/portage.sh
        to: /usr/local/lib/corvus-build/lib/portage.sh
        mode: '0644'
    - file:
        from: ./scripts/stages/kernel/build-kernel.sh
        to: /usr/local/lib/corvus-build/stages/kernel/build-kernel.sh
        mode: '0755'
    - file:
        from: ./scripts/stages/musl/configure-root.sh
        to: /usr/local/lib/corvus-build/stages/musl/configure-root.sh
        mode: '0755'
    - file:
        from: ./scripts/stages/kernel/gentoo-kernel
        to: /tmp/gentoo-kernel-config
        mode: '0644'
    - shell:
        inline: /bin/bash /usr/local/lib/corvus-build/images/gentoo-musl-openrc-builder/build.sh
        env:
          MUSL_STAGE3_URL: '{{ musl_stage3_url }}'
          MUSL_STAGE3_SHA256: '{{ musl_stage3_sha256 }}'
        timeoutSec: 28800
    cleanup: onSuccess
- apply:
    templates:
    - name: gentoo-musl-openrc-builder-bake
      description: Native musl/OpenRC host with Portage, compiler and disk tools
      cpuCount: 8
      ram: 16G
      cloudInit: false
      guestAgent: true
      headless: true
      startupTimeoutSec: 1200
      sharedDirs:
      - path: '{{ cache_dir }}'
        tag: corvus-cache
      drives:
      - diskImage: gentoo-musl-openrc-builder
        interface: virtio
        strategy: overlay
        discard: true
        size: 40G
        cacheType: writeback
      networkInterfaces:
      - network: corvus
