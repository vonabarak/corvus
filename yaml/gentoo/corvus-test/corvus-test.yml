# yaml-language-server: $schema=../../../schema/json/build.schema.json
vars:
  portage_keyserver: hkps://keys.gentoo.org
  image_if_exists: update
  cache_dir: /data/corvus-cache
  USEPKG: 'true'
  GETBINPKG: 'true'
pipeline:
- apply:
    templates:
    - name: corvus-test-bake
      hidden: true
      cpuCount: 8
      ram: 16G
      cloudInit: true
      guestAgent: true
      startupTimeoutSec: 1200
      description: Native glibc builder for the Python corvus-test-node recipe
      sharedDirs:
      - path: '{{ cache_dir }}'
        tag: corvus-cache
      drives:
      - diskImage: gentoo-glibc-systemd-builder-cloudinit:latest
        interface: virtio
        strategy: overlay
        cacheType: writeback
        discard: true
        size: 40G
      - diskImage: ovmf-code
        interface: pflash
        readOnly: true
        strategy: direct
      - diskImage: ovmf-vars
        interface: pflash
        strategy: clone
      networkInterfaces:
      - network: corvus
      sshKeys:
      - name: corvus
- build:
    name: gentoo-corvus-test
    description: Python-built Gentoo integration-test node
    template: corvus-test-bake
    strategy: offline-overlay
    sourceImage: gentoo-glibc-systemd-headless
    target:
      path: gentoo-corvus-test/
      ifExists: '{{ image_if_exists }}'
      compact: true
      ephemeral: true
    shellDefaults:
      preamble: set -eux
      env:
        USEPKG: '{{ USEPKG }}'
        GETBINPKG: '{{ GETBINPKG }}'
        PORTAGE_KEYSERVER: '{{ portage_keyserver }}'
        IMAGE_LIBC: glibc
        IMAGE_INIT: systemd
        IMAGE_ROOT: /mnt/sysroot
        TARGET_DISK: /dev/vdb
        FEATURES: -userfetch -userpriv
    provisioners:
    - file:
        from: ./build.pyz
        to: /run/corvus-test.pyz
        mode: '0644'
    - shell:
        inline: python3 /run/corvus-test.pyz
        timeoutSec: 18000
    cleanup: onSuccess
- apply:
    vms:
    - name: gentoo-corvus-test
      cpuCount: 8
      ram: 16G
      cloudInit: true
      guestAgent: true
      headless: true
      description: Test Gentoo VM for Corvus
      drives:
      - disk: gentoo-corvus-test
        interface: virtio
        cacheType: writeback
        discard: true
      networkInterfaces:
      - network: corvus
      sshKeys:
      - corvus
      cloudInitConfig:
        userData:
          runcmd:
          - - passwd
            - -d
            - root
          users:
          - name: corvus
            groups:
            - kvm
            sudo: ALL=(ALL) NOPASSWD:ALL
            shell: /bin/bash
      sharedDirs:
      - path: '{{ cache_dir }}'
        tag: corvus-cache
