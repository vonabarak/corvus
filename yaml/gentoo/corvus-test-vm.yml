# yaml-language-server: $schema=../../schema/json/build.schema.json
# Test guest built with dedicated orchestration and the shared musl stages and kernel configuration.
vars:
  portage_keyserver: hkps://keys.gentoo.org
  image_if_exists: update
  cache_dir: /data/corvus-cache
  USEPKG: "true"
  GETBINPKG: "true"
pipeline:
- build:
    name: corvus-test-vm
    description: Gentoo musl/OpenRC integration-test guest
    template: gentoo-musl-openrc-builder-bake
    strategy: from-scratch
    target:
      ifExists: '{{ image_if_exists }}'
      format: qcow2
      size: 1G
      path: BaseImages/Gentoo/
      compact: true
    vm:
      cpuCount: 8
      ram: 8G
    shellDefaults:
      preamble: set -eux
      env:
        USEPKG: '{{ USEPKG }}'
        GETBINPKG: '{{ GETBINPKG }}'
        PORTAGE_KEYSERVER: '{{ portage_keyserver }}'
        IMAGE_LIBC: musl
        IMAGE_INIT: openrc
        IMAGE_ESP_SIZE: 64M
        IMAGE_KERNEL_ARGS: net.ifnames=0
        IMAGE_ROOT: /mnt/sysroot
        TARGET_DISK: /dev/vdb
        FEATURES: -userfetch -userpriv
    provisioners:
    - file:
        from: ./scripts/images/corvus-test-vm/build.sh
        to: /usr/local/lib/corvus-build/images/corvus-test-vm/build.sh
        mode: '0755'
    - file:
        from: ./scripts/images/corvus-test-vm/configure-root.sh
        to: /usr/local/lib/corvus-build/images/corvus-test-vm/configure-root.sh
        mode: '0755'
    - file:
        from: ./scripts/images/corvus-test-vm/install-root.sh
        to: /usr/local/lib/corvus-build/images/corvus-test-vm/install-root.sh
        mode: '0755'
    - file:
        from: ./scripts/images/corvus-test-vm/lib.sh
        to: /usr/local/lib/corvus-build/images/corvus-test-vm/lib.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/disk.sh
        to: /usr/local/lib/corvus-build/lib/disk.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/environment.sh
        to: /usr/local/lib/corvus-build/lib/environment.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/image.sh
        to: /usr/local/lib/corvus-build/lib/image.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/mounts.sh
        to: /usr/local/lib/corvus-build/lib/mounts.sh
        mode: '0644'
    - file:
        from: ./scripts/lib/portage.sh
        to: /usr/local/lib/corvus-build/lib/portage.sh
        mode: '0644'
    - file:
        from: ./scripts/stages/kernel/build-kernel.sh
        to: /usr/local/lib/corvus-build/stages/kernel/build-kernel.sh
        mode: '0755'
    - file:
        from: ./scripts/stages/musl/configure-root.sh
        to: /usr/local/lib/corvus-build/stages/musl/configure-root.sh
        mode: '0755'
    - file:
        from: ./scripts/stages/kernel/gentoo-kernel
        to: /tmp/gentoo-kernel-config
        mode: '0644'
    - file:
        from: ../../integration_tests/keys/corvus-test-key.pub
        to: /tmp/corvus-test-key.pub
        mode: '0644'
    - shell:
        inline: /bin/bash /usr/local/lib/corvus-build/images/corvus-test-vm/build.sh
        timeoutSec: 28800
    cleanup: onSuccess
