# Anaconda discovers this file at the root of the OEMDRV answer ISO.
text
# Use the DVD already mounted by dracut. AlmaLinux's x86_64_v2 .discinfo
# fails Anaconda's strict x86_64 architecture check for the cdrom source.
url --url=file:///run/install/repo/BaseOS
repo --name=AppStream --baseurl=file:///run/install/repo/AppStream
lang en_US.UTF-8
keyboard us
timezone Etc/UTC --utc
network --bootproto=dhcp --device=link --activate
rootpw --lock
# Example desktop credentials; change the password before building your own image.
user --name=corvus --groups=wheel --password=$6$corvus-example$HPorJFH98dbG/kh/nAtcfm1W7eXPbIRcC7XHpYL6gnZk235miWUgWxahtWqPfyX8uXS.tJM12yfIHBkH1N6Pe/ --iscrypted
firewall --enabled
selinux --enforcing
firstboot --disable
skipx
ignoredisk --only-use=vda
zerombr
clearpart --all --initlabel --drives=vda
autopart --type=lvm
bootloader --location=mbr --boot-drive=vda
services --enabled=qemu-guest-agent,gdm,NetworkManager
poweroff

%packages
@^workstation-product-environment
qemu-guest-agent
policycoreutils-python-utils
spice-vdagent
kernel-modules-extra
alsa-utils
pipewire-utils
-cloud-init
%end

%post --erroronfail --log=/root/corvus-kickstart.log
set -eu
systemctl set-default graphical.target
mkdir -p /etc/gdm /var/lib/AccountsService/users /home/corvus/.config
cat > /etc/gdm/custom.conf <<'EOF'
[daemon]
AutomaticLoginEnable=True
AutomaticLogin=corvus
EOF
cat > /var/lib/AccountsService/users/corvus <<'EOF'
[User]
SystemAccount=false
Session=gnome
XSession=gnome
EOF
# GNOME Initial Setup uses this marker to avoid interrupting the first login.
echo yes > /home/corvus/.config/gnome-initial-setup-done
chown -R corvus:corvus /home/corvus/.config
restorecon -RF /home/corvus/.config /etc/gdm /var/lib/AccountsService
systemctl enable qemu-guest-agent.service gdm.service
# AlmaLinux 10 allows only selected guest-agent RPCs by default. Corvus
# needs both commands to run a probe and collect its exit status.
grep -q '^FILTER_RPC_ARGS="--allow-rpcs=' /etc/sysconfig/qemu-ga
sed -i '/^FILTER_RPC_ARGS="--allow-rpcs=/ s/"$/,guest-exec,guest-exec-status"/' /etc/sysconfig/qemu-ga
# QGA launches commands in virt_qemu_ga_t. Its stock SELinux policy denies
# runuser, systemd queries, and access to the desktop user's PipeWire socket.
# Keep SELinux enforcing for other domains while allowing these QGA commands.
semanage permissive -a virt_qemu_ga_t
# A reusable image receives a new machine identity on its next boot.
truncate -s 0 /etc/machine-id
rm -f /var/lib/dbus/machine-id /etc/ssh/ssh_host_*
mkdir -p /var/lib/corvus
touch /var/lib/corvus/installer-complete
%end
